<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educational CSS Grid Classroom Diagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid-container" id="grid-container">
    
    <!-- HEADER -->
    <header class="grid-box header" id="item-header">
      <div class="box-title">HEADER</div>
    </header>

    <!-- FEATURED ARTICLE -->
    <article class="grid-box featured" id="item-featured">
      <h2 class="box-title">FEATURED ARTICLE</h2>
    </article>

    <!-- ARTICLE 1 -->
    <article class="grid-box article-1" id="item-article-1">
      <h3 class="box-title">ARTICLE 1</h3>
    </article>

    <!-- ARTICLE 2 -->
    <article class="grid-box article-2" id="item-article-2">
      <h3 class="box-title">ARTICLE 2</h3>
    </article>

    <!-- ARTICLE 4 -->
    <article class="grid-box article-4" id="item-article-4">
      <h3 class="box-title">ARTICLE 4</h3>
    </article>

    <!-- ARTICLE 5 -->
    <article class="grid-box article-5" id="item-article-5">
      <h3 class="box-title">ARTICLE 5</h3>
    </article>

    <!-- ARTICLE 6 -->
    <article class="grid-box article-6" id="item-article-6">
      <h3 class="box-title">ARTICLE 6</h3>
    </article>

  </div>
</body>
</html>
